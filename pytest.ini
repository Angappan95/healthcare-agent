[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test

# Markers for test categorization
markers =
    unit: Unit tests (do not require services)
    integration: Integration tests (require Docker services)
    requires_services: Tests that need ./start-services.sh
    slow: Tests that take significant time to run
    api_keys: Tests that require API keys configured

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage
addopts = 
    --strict-markers
    --tb=short
    -v

# Ignore patterns
norecursedirs = .git .venv __pycache__ *.egg-info
