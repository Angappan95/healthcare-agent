[project]
name = "data-analyser"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langchain-google-genai",
    "langgraph",
    "pydantic",
    "requests",
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
log_cli = true
log_cli_level = "INFO"
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] %(name)s - %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
