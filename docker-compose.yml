version: '3.8'

services:
  # PubMed Agent Service
  pubmed-agent:
    build:
      context: .
      dockerfile: Dockerfile.pubmed
    container_name: healthcare-pubmed-agent
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # WebSearch Agent Service
  websearch-agent:
    build:
      context: .
      dockerfile: Dockerfile.websearch
    container_name: healthcare-websearch-agent
    ports:
      - "8002:8002"
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Synthesis Agent Service
  synthesis-agent:
    build:
      context: .
      dockerfile: Dockerfile.synthesis
    container_name: healthcare-synthesis-agent
    ports:
      - "8003:8003"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8003/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Supervisor Agent Service (FastAPI)
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile.supervisor
    container_name: healthcare-supervisor
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PUBMED_SERVICE_URL=http://pubmed-agent:8001
      - WEBSEARCH_SERVICE_URL=http://websearch-agent:8002
      - SYNTHESIS_SERVICE_URL=http://synthesis-agent:8003
    depends_on:
      pubmed-agent:
        condition: service_healthy
      websearch-agent:
        condition: service_healthy
      synthesis-agent:
        condition: service_healthy
    networks:
      - healthcare-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  healthcare-net:
    driver: bridge
    name: healthcare-agent-network

volumes:
  pubmed-data:
  websearch-cache:
  synthesis-cache:
